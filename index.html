<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mis IAs</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js" defer></script>
  <script src="config.js?v=3" defer></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <div class="app">
    <!-- Barra lateral: conversaciones -->
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✦</span> <span id="appName">Mis IAs</span></div>

      <nav class="tabs">
        <button class="tab active" data-view="chat">💬 Chat</button>
        <button class="tab" data-view="cuentas">🔑 Mis cuentas</button>
      </nav>

      <button class="btn-new" id="newChat">＋ Nueva conversación</button>
      <div class="chat-list" id="chatList"></div>

      <div class="account" id="account"></div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Vista: Chat -->
    <main class="main" id="viewChat">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menú">☰</button>

        <div class="picker">
          <button class="picker-btn" id="pickerBtn" aria-haspopup="listbox">
            <span class="dot" id="pickerDot"></span>
            <span class="picker-label" id="pickerLabel">Elige un modelo</span>
            <span class="chev">▾</span>
          </button>
          <div class="picker-panel" id="pickerPanel" hidden>
            <input class="picker-search" id="pickerSearch" type="search" placeholder="Buscar modelo…" autocomplete="off" />
            <label class="free-toggle"><input type="checkbox" id="freeOnly" /> Solo gratis</label>
            <div class="picker-tree" id="pickerTree"></div>
          </div>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Escribe un mensaje…" autocomplete="off"></textarea>
        <button type="submit" class="send" id="sendBtn" aria-label="Enviar">➤</button>
      </form>
    </main>

    <!-- Vista: Mis cuentas -->
    <main class="main" id="viewCuentas" hidden>
      <header class="topbar">
        <button class="icon-btn menu-btn" aria-label="Menú" data-menu>☰</button>
        <h1 class="topbar-title">Mis cuentas</h1>
      </header>
      <section class="cuentas">
        <p class="cuentas-intro">Abre cada IA en su web oficial con tu sesión y tu plan.</p>
        <div class="cards" id="cards"></div>
      </section>
    </main>
  </div>

  <!-- Ventana para pegar la clave a mano -->
  <dialog id="keyDialog">
    <form method="dialog" class="key-form">
      <h2>Pegar clave de OpenRouter</h2>
      <p>Si prefieres no usar el botón de iniciar sesión, crea una clave en
        <a href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener">openrouter.ai/settings/keys</a> y pégala aquí.
        Solo se guarda en este navegador.</p>
      <input id="keyInput" type="password" placeholder="sk-or-..." autocomplete="off" />
      <div class="key-actions">
        <button value="cancel" class="btn-ghost">Cancelar</button>
        <button value="ok" class="btn-primary" id="keySave">Guardar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
